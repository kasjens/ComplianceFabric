apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    fabric.control-id: annex11-12-1-access-control
    policies.kyverno.io/title: Require runAsNonRoot
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Pods must set spec.securityContext.runAsNonRoot=true (Annex 11 logical access control)."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
