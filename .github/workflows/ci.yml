name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Validate controls
        run: go run ./cmd/fabric validate controls

      - name: Assess control coverage
        run: go run ./cmd/fabric assess --strict controls

      - name: Verify policy library traceability
        run: go run ./cmd/fabric policies controls policies

      - name: Compose deployable policy set
        run: go run ./cmd/fabric generate controls policies "$(mktemp -d)"
