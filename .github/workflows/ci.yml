name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -race is what makes the ledger's concurrency guarantees actually tested:
      # its appends serialize against each other, and a regression there corrupts
      # the hash chain in a way indistinguishable from tampering.
      - name: Test
        run: go test -race ./...

      - name: Validate controls
        run: go run ./cmd/fabric validate controls

      - name: Assess control coverage
        run: go run ./cmd/fabric assess --strict controls

      - name: Verify policy library traceability
        run: go run ./cmd/fabric policies controls policies

      - name: Compose deployable policy set
        run: go run ./cmd/fabric generate controls policies "$(mktemp -d)"

  commands-e2e:
    name: Every CLI subcommand runs
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      # Eight commands were covered by go test but never executed as the real
      # binary. A unit test proves a function; it does not prove the command
      # wired to it parses its flags, finds its inputs, and exits with the code
      # the pipeline branches on.
      - name: Prove report, drift, eval-gate, ledger, registry, collect, crosswalk and serve
        run: bash test/e2e/commands.sh

  gateway-e2e:
    name: Phase 4 inline gateway e2e
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Prove the inline agent gateway end-to-end
        run: bash test/e2e/gateway.sh

  gateway-proxy-e2e:
    name: Phase 4 live gateway-proxy e2e
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Prove the live gateway proxy enforces policy on the wire end-to-end
        run: bash test/e2e/gateway-proxy.sh

  sbom-e2e:
    name: Phase 2/3 SBOM-content e2e (syft)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      # Pinned to a specific syft release rather than whatever "latest" resolves
      # to on the day; the installer verifies the release checksums itself.
      # Residual: the install script is still fetched from the repo's main
      # branch, so this pins WHAT is installed but not the installer that does it.
      - name: Install syft
        run: |
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v1.49.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prove SBOM-content evidence from a real syft scan
        run: bash test/e2e/sbom.sh

  release-e2e:
    name: Phase 2/3 release-gate e2e (syft)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      # Pinned to a specific syft release rather than whatever "latest" resolves
      # to on the day; the installer verifies the release checksums itself.
      # Residual: the install script is still fetched from the repo's main
      # branch, so this pins WHAT is installed but not the installer that does it.
      - name: Install syft
        run: |
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v1.49.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Prove the release evidence gate end-to-end
        run: bash test/e2e/release.sh

  e2e:
    name: Phase 1 admission e2e (kind)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl \
            "https://dl.k8s.io/release/v1.30.4/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Prove live admission enforcement
        run: bash test/e2e/admission.sh

  keyless-e2e:
    name: Phase 2 keyless admit-path e2e (kind)
    runs-on: ubuntu-latest
    needs: build
    # Keyless signing needs the repo's own OIDC identity; forks cannot mint it,
    # so skip there rather than fail.
    if: github.repository == 'kasjens/ComplianceFabric'
    permissions:
      contents: read
      # Required so cosign can mint a Fulcio certificate from the Actions OIDC
      # token and produce the keyless signature the production policy trusts.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -fsSLo kubectl \
            "https://dl.k8s.io/release/v1.30.4/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Prove keyless signature admit/deny against the production policy
        run: bash test/e2e/keyless-ci.sh

  # The suite is now platform-portable, so it is proven so on every push rather
  # than left to drift back into being Linux-only.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Test
        run: go test -race ./...
