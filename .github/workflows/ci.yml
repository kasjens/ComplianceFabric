name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Validate controls
        run: go run ./cmd/fabric validate controls

      - name: Assess control coverage
        run: go run ./cmd/fabric assess --strict controls

      - name: Verify policy library traceability
        run: go run ./cmd/fabric policies controls policies

      - name: Compose deployable policy set
        run: go run ./cmd/fabric generate controls policies "$(mktemp -d)"

  e2e:
    name: Phase 1 admission e2e (kind)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install kind
        run: |
          curl -fsSLo /usr/local/bin/kind \
            https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -fsSLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl

      - name: Prove live admission enforcement
        run: bash test/e2e/admission.sh

  keyless-e2e:
    name: Phase 2 keyless admit-path e2e (kind)
    runs-on: ubuntu-latest
    needs: build
    # Keyless signing needs the repo's own OIDC identity; forks cannot mint it,
    # so skip there rather than fail.
    if: github.repository == 'kasjens/ComplianceFabric'
    permissions:
      contents: read
      # Required so cosign can mint a Fulcio certificate from the Actions OIDC
      # token and produce the keyless signature the production policy trusts.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -fsSLo /usr/local/bin/kind \
            https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x /usr/local/bin/kind

      - name: Install kubectl
        run: |
          curl -fsSLo /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /usr/local/bin/kubectl

      - name: Prove keyless signature admit/deny against the production policy
        run: bash test/e2e/keyless-ci.sh
