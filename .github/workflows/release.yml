name: Release

# The release pipeline. On a tagged release it regenerates the supply-chain
# evidence and gates the release on it: syft produces a real SBOM of the released
# tree, `fabric release-gate` turns it into control evidence keyed to
# cfr-part-11-10a-system-validation, appends it to a fresh per-release ledger, and
# clears the release only when the chain verifies and every control is satisfied.
# The verified ledger and the SBOM are uploaded as release evidence artifacts.
#
# This binds the generation harness into the release pipeline itself, rather than
# leaving it as the test/e2e/release.sh proof.

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Required so cosign can mint a Fulcio certificate from the Actions OIDC token
  # and sign the release artifacts keylessly - the same identity the admission
  # policy trusts.
  id-token: write

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    env:
      # The builder identity asserted in the provenance and required by
      # release/manifest.json. Deliberately WITHOUT a git ref: the manifest is a
      # committed artifact and would otherwise need editing for every tag. The
      # ref is enforced separately, in the guard step below, which is where a
      # "released from a tag" rule belongs.
      BUILDER_ID: https://github.com/kasjens/ComplianceFabric/.github/workflows/release.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'

      # The provenance asserts a builder identity without a git ref, so the
      # "this was released from a tag" rule is enforced here instead of being
      # implied. A manual dispatch from a branch produces evidence that says so.
      - name: Guard - a published release must come from a tag
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        run: |
          case "${{ github.ref }}" in
            refs/tags/*) echo "releasing from ${{ github.ref }}" ;;
            *) echo "::error::a release must be built from a tag, got ${{ github.ref }}"; exit 1 ;;
          esac

      - name: Build fabric (stdlib-only)
        run: go build -o fabric ./cmd/fabric

      # Pinned to a specific syft release rather than whatever "latest" resolves
      # to on the day; the installer verifies the release checksums itself.
      # Residual: the install script is still fetched from the repo's main
      # branch, so this pins WHAT is installed but not the installer that does it.
      - name: Install syft
        run: |
          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v1.49.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate the release SBOM
        run: syft dir:. -o cyclonedx-json > release/sbom.cyclonedx.json

      # The provenance attests WHO built the artifact and WHAT was built, keyed to
      # the binary's own content digest. That digest becomes the evidence record's
      # artifact-ref, which is what lets a reviewer pivot from a control record to
      # the exact artifact and its transparency-log entry. The SBOM alone cannot
      # supply that: `syft dir:.` scans a directory, so it emits no image purl and
      # leaves the ref empty.
      - name: Generate SLSA provenance for the built binary
        run: |
          digest="$(sha256sum fabric | cut -d' ' -f1)"
          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > release/provenance.json <<JSON
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [
              { "name": "fabric", "digest": { "sha256": "$digest" } }
            ],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://github.com/actions/runner",
                "externalParameters": {
                  "repository": "${{ github.repository }}",
                  "ref": "${{ github.ref }}",
                  "sha": "${{ github.sha }}",
                  "workflowRef": "${{ github.workflow_ref }}"
                }
              },
              "runDetails": {
                "builder": { "id": "$BUILDER_ID" },
                "metadata": {
                  "invocationId": "${{ github.run_id }}",
                  "finishedOn": "$finished"
                }
              }
            }
          }
          JSON
          cat release/provenance.json

      - name: Gate the release on its evidence
        run: ./fabric release-gate release/manifest.json --ledger release/release.ledger

      - name: Verify the release evidence ledger
        run: ./fabric ledger verify release/release.ledger

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signing identity is this workflow's OIDC identity, recorded
      # in a Fulcio certificate and logged in Rekor. Signing the LEDGER as well as
      # the artifacts is the point - the evidence is only worth as much as its
      # binding to the thing it describes.
      - name: Sign the release artifacts and their evidence
        run: |
          # Cosign v3 emits a Sigstore BUNDLE: one file carrying the signature,
          # the Fulcio certificate and the Rekor inclusion proof together. The
          # older --output-signature/--output-certificate pair is deprecated and
          # silently ignored under the new bundle format.
          for f in fabric release/sbom.cyclonedx.json release/provenance.json release/release.ledger; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          ls -la fabric.sigstore.json release/*.sigstore.json

      # Verify what we just signed, in the same job. An unverifiable signature is
      # worse than none: it looks like assurance and is not.
      - name: Verify the signatures
        run: |
          ident="${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}"
          issuer="https://token.actions.githubusercontent.com"
          for f in fabric release/sbom.cyclonedx.json release/provenance.json release/release.ledger; do
            cosign verify-blob "$f" --bundle "$f.sigstore.json" --certificate-identity "$ident" --certificate-oidc-issuer "$issuer"
          done

      - name: Upload release evidence artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: |
            release/sbom.cyclonedx.json
            release/provenance.json
            release/release.ledger
            release/*.sigstore.json
            fabric.sigstore.json

      - name: Attach release evidence to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release/sbom.cyclonedx.json release/provenance.json release/release.ledger \
            release/sbom.cyclonedx.json.sigstore.json \
            release/provenance.json.sigstore.json \
            release/release.ledger.sigstore.json \
            --clobber
